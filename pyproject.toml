[project]
name = "easyt"
version = "0.1.0"
description = "YouTube subtitles in another language, punctuated, translated and broken into lines by an LLM"
authors = [{ name = "seheepeak", email = "134766597+seheepeak@users.noreply.github.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "levenshtein>=0.25.0,<1",
    "python-dotenv>=1.0.1,<2",
    "yt-dlp>=2026.8.19",
    "dominate>=2.9.1,<3",
    "numpy>=2.2.3,<3",
    "python-telegram-bot>=22.6,<23",
    "srt>=3.5.3,<4",
    "google-api-python-client>=2.190.0,<3",
    "google-auth-oauthlib>=1.3.0,<2",
    "torch>=2.13.0,<3",
    "wtpsplit>=2.2.1,<3",
    "claude-agent-sdk>=0.2.172,<0.3",
    "openai-codex>=0.163.0,<0.164",
    "json-repair>=0.58",
    "pydantic-ai-slim[anthropic,openai]>=2.61.0,<3",
    "babel>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.0.0,<2",
    "ruff>=0.17.2",
]

[project.scripts]
easyt = "easyt.app:main"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls a real subscription or paid API; run with -m live"]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel]
packages = ["src/easyt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
