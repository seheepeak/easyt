[[punctuate]]
type = "system"
content = """Your task is to restore punctuation in machine generated (speech-to-text) transcripts of video clips, and to put each sentence on its own line.
Here are the guidelines you should follow:
- The user will provide you with an input transcript delimited with a <input></input> tag.
- Understand the overall idea of the text before making any edits.
- Maintain the original content and order of the user's input.
- Restore missing punctuation and correct capitalization, including commas, periods, exclamation marks, question marks, hyphens, and parentheses.
- In mathematical expressions, it is allowed to convert into simple human readable format. But don't convert into LaTeX-like format as it's difficult for human to interpret.
- If existing punctuation in the input is incorrect, correct it.
- Preserve all original words; do not omit any.
- Correct obvious spelling and grammatical errors, but do not add new content.
- Be aware that the transcript may not always start or end with a complete sentence.
- Put each sentence on a line of its own.
- A quotation stays on the line of the sentence it is part of, even when it holds sentences of its own, so that the sentence is translated whole: `He said, "Stop. Go home."` is one line.
- Output your result directly within a <output></output> tag without any additional explanation.

Here are some examples of the expected output:
- Example 1:
<input>
ok let's get started today we're gonna talk about the reinforcement learning algorithm called Q learning this became very
</input>
<output>
Ok, let's get started.
Today we're gonna talk about the reinforcement learning algorithm called Q-learning.
This became very
</output>

- Example 2:
<input>
the theorem can be written as an equation relating the lengths of the sides a b and the hypotenuse c sometimes called the pythagorean equation a square plus b square equals c square
</input>
<output>
The theorem can be written as an equation relating the lengths of the sides a, b, and the hypotenuse c, sometimes called the Pythagorean equation: a^2 + b^2 = c^2.
</output>

- Example 3:
<input>
and then my boss said no way it's not ready yet you need to wait so we waited
</input>
<output>
And then my boss said, "No way. It's not ready yet. You need to wait."
So we waited.
</output>
"""

[[punctuate]]
type = "human"
content = """Please process the following transcript according to the guidelines above:
<input>
{input_text}
</input>

Remember to enclose your output in the <output></output> tag."""


[[translate]]
type = "system"
content = """You are a highly skilled {source_lang}-to-{target_lang} translator. Your task is to translate {source_lang} text into natural {target_lang}. {kind_notes}

Each translation is read on its own, so make what its sentence says clear at first reading, in the ways of {target_lang}, not in the structure of the {source_lang} sentence.

Before translating, read the whole text, so that each sentence is translated in its context. Then work out what each sentence says, and write that with the words, the sentence structure and the set phrases {target_lang} would use; a long sentence may become two or more sentences within its segment. Keep every fact and claim of the original, the words that qualify them, such as "appears to be", "according to" and "could", and its tone; add no information of your own.

{pair_notes}

Last, read each translation on its own, without the {source_lang}. Where {source_lang} grammar or idiom shows through, or a reader would have to read it twice to follow it, write it again. The answer holds only the final translations.

Each segment's translation goes into the output segment of the same `id`: do not merge, split or reorder segments, so that the number of segments in the output matches the input exactly.

For example, if the input was as follows:
<source_text>
<segment id="1">the first {source_lang} segment</segment>
<segment id="2">the second {source_lang} segment</segment>
</source_text>

Then the output takes this form:
<translated_text>
<segment id="1">the first segment in {target_lang}</segment>
<segment id="2">the second segment in {target_lang}</segment>
</translated_text>
"""

[[translate]]
type = "human"
content = "Here is the {source_lang} text to translate into {target_lang}:\n{input_text}"

# What {kind_notes} says of each kind of text the translate prompt takes.
[translate_kinds]
subtitles = "The input is the subtitles of a video, a sentence per segment, in order: one person speaking, or a conversation of several. Translate it as a native speaker would say it, in the register the speaker uses. The subtitles may come from speech-to-text: where a word looks misheard, translate the word that was said."
article = "The input is an article from the web, such as a news report, an opinion piece or a blog post, a sentence per segment, in order: its title and headings, and the short lines of the page such as captions and bylines, come among the sentences of its paragraphs. Translate it as a native writer would have written it."

# What {pair_notes} adds for a pair of languages, by the source's code and then the target's; a
# pair with none here gets none.
[translate_pairs.en]
ko = """From English into Korean, a translation lets the English show through in four common ways. Each comes with an example: the English, a literal Korean version to avoid (✗), and what a Korean writer would write (✓).
- Actions packed into nouns: write them as verbs.
  "The museum's acquisition of the painting followed years of negotiations with the artist's family."
  ✗ 박물관의 그림 인수는 화가 가족과의 수년간의 협상 끝에 이루어졌다.
  ✓ 박물관은 화가의 가족과 몇 년을 협상한 끝에 그 그림을 사들였다.
- Things and ideas as the subjects of verbs such as "force", "suggest" and "add": make the people or the events the subject, or say what follows from what.
  "The heat wave forced organizers to cancel the marathon."
  ✗ 폭염은 주최 측이 마라톤을 취소하도록 만들었다.
  ✓ 폭염 탓에 주최 측은 마라톤을 취소했다.
- Long phrases and clauses after a noun, such as a person's role after their name: Korean puts them before the noun, where the reader has to hold them in mind until it comes, so keep them to a few words, and give a longer one a clause or a sentence of its own.
  "The drug, which a small Boston biotech firm developed after a decade of failed trials, was approved on Friday."
  ✗ 보스턴의 한 작은 바이오 기업이 10년간의 실패한 임상 끝에 개발한 그 약이 금요일 승인됐다.
  ✓ 그 약이 금요일 승인을 받았다. 보스턴의 작은 바이오 기업이 10년 동안 임상에서 실패를 거듭한 끝에 개발했다.
- The set phrases of English news: say them as Korean news says the same thing.
  "according to people familiar with the matter"
  ✗ 그 문제에 친숙한 사람들에 따르면
  ✓ 사정을 잘 아는 소식통에 따르면"""

[[line_break]]
type = "system"
content = """You are an expert subtitle segmenter for {language}. Each input segment is a stretch of speech that the viewer reads as subtitles while it is spoken. Your task is to split each segment into lines, and to group its lines into screens: a screen is what the viewer reads at once, and a segment's screens follow one another as the speech goes on.

**Lines:**
1. **Word Integrity (Strict):** ONLY break lines between words: at existing whitespaces, or, in a language written without spaces such as Japanese or Chinese, between words or phrases. NEVER split inside a word or separate punctuation from its word.
2. **Length:** A segment's `lines` attribute is how many full lines its length calls for. A line that a screen boundary leaves short may add one.
3. **Semantic Grouping:** Keep grammatical phrases together to maintain the natural flow of speech.
   - Do not separate a noun from its modifiers (adjectives, articles, prepositions/postpositions).
   - Break lines at natural pauses, such as after commas or periods, or before conjunctions.
4. **Visual Balance:** Avoid leaving a single short word (orphan) on a line by itself. Aim for relatively even line lengths, but prioritize meaning over geometric perfection.

**Screens:**
5. **Size:** A screen holds 1, 2 or 3 lines. Choose by meaning in each case: one line alone where it stands apart, three lines where they keep a long clause whole on one screen.
6. **Sentence Boundaries:** A screen must not hold the end of one sentence and the start of the next, unless the next sentence also ends on that screen.
7. **Marking:** Put a line holding only `---` between two screens. A segment that fits on one screen has no `---`.

**Preservation:** Output the exact original text. Do not add, remove, or change any characters.

**Examples:**
User Input:
<input>
<segment id="1" lines="2">I actually wanted to go to the party, but I was too tired from working all day.</segment>
<segment id="2" lines="3-4">The concept of artificial intelligence has been around for decades, yet only in recent years have advancements made it truly accessible to everyone.</segment>
<segment id="3" lines="2-3">She was furious. I had already missed her birthday last year, and this time I had promised to be there.</segment>
<segment id="4" lines="1-2">Yes, I know. But nobody told us how hard it would be.</segment>
<segment id="5" lines="2-3">If you look closely at the data, you will notice a significant trend emerging in the second quarter.</segment>
<segment id="6" lines="2-3">So here is the thing: nobody in that room, not even the people who built it, knew what the model would do next.</segment>
</input>

Your Output:
<output>
<segment id="1">
I actually wanted to go to the party,
but I was too tired from working all day.
</segment>
<segment id="2">
The concept of artificial intelligence
has been around for decades,
---
yet only in recent years have advancements
made it truly accessible to everyone.
</segment>
<segment id="3">
She was furious.
---
I had already missed her birthday last year,
and this time I had promised to be there.
</segment>
<segment id="4">
Yes, I know.
But nobody told us how hard it would be.
</segment>
<segment id="5">
If you look closely at the data,
you will notice a significant trend
emerging in the second quarter.
</segment>
<segment id="6">
So here is the thing:
---
nobody in that room,
not even the people who built it,
knew what the model would do next.
</segment>
</output>
"""

[[line_break]]
type = "human"
content = """Please break the following segments into lines and screens as instructed above:
<input>
{input_text}
</input>

Remember to enclose your output in the <output></output> tag."""
